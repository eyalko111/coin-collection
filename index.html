    // Custom Dropdowns for Country & Currency in Modal
    function setCountryInputVisualState(countryName, flagEmoji = "") {
      const inputEl = document.getElementById("form-country-input");
      const flagEl = document.getElementById("form-country-flag");
      const clearBtn = document.getElementById("btn-clear-country");
      const hasVal = !!(countryName && countryName.trim());

      document.getElementById("form-country").value = hasVal ? countryName.trim() : "";
      inputEl.value = hasVal ? countryName : "";

      if (hasVal && flagEmoji) {
        flagEl.textContent = flagEmoji;
        flagEl.classList.remove("hidden");
        inputEl.classList.remove("pr-3");
        inputEl.classList.add("pr-9");
      } else {
        flagEl.textContent = "";
        flagEl.classList.add("hidden");
        inputEl.classList.remove("pr-9");
        inputEl.classList.add("pr-3");
      }

      clearBtn.classList.toggle("hidden", !inputEl.value.trim());
      updateFormSeriesInfoButton(hasVal ? countryName.trim() : "");
    }

    function clearCountryField() {
      setCountryInputVisualState("", "");
      resetCurrencyFieldEmpty();
      const inputEl = document.getElementById("form-country-input");
      inputEl.focus();
      openCountryDropdown();
    }

    function openCountryDropdown() {
      closeCurrencyDropdown();
      renderCountryDropdownList(document.getElementById("form-country-input").value);
      document.getElementById("country-dropdown-menu").classList.remove("hidden");
    }

    function closeCountryDropdown() {
      document.getElementById("country-dropdown-menu").classList.add("hidden");
    }

    function toggleCountryDropdown() {
      const menu = document.getElementById("country-dropdown-menu");
      if (menu.classList.contains("hidden")) {
        openCountryDropdown();
      } else {
        closeCountryDropdown();
      }
    }

    function onCountryInputChange() {
      const inputEl = document.getElementById("form-country-input");
      const query = inputEl.value;
      document.getElementById("btn-clear-country").classList.toggle("hidden", !query.trim());

      const exact = COUNTRIES_DB.find(c => c.name === query.trim());
      if (exact) {
        setCountryInputVisualState(exact.name, exact.flag);
        onFormCountryChange();
      } else {
        document.getElementById("form-country").value = query.trim();
        document.getElementById("form-country-flag").classList.add("hidden");
        inputEl.classList.remove("pr-9");
        inputEl.classList.add("pr-3");
        updateFormSeriesInfoButton(query.trim());
      }

      renderCountryDropdownList(query);
      document.getElementById("country-dropdown-menu").classList.remove("hidden");
    }

    function renderCountryDropdownList(rawQuery) {
      const q = (rawQuery || "").trim().toLowerCase();
      const menu = document.getElementById("country-dropdown-menu");

      let matches = COUNTRIES_DB;
      if (q) {
        matches = COUNTRIES_DB
          .filter(c => c.name.toLowerCase().includes(q))
          .sort((a, b) => {
            const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
            const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
            return hebrewCollator.compare(a.name, b.name);
          });
      }

      if (!matches.length) {
        menu.innerHTML = `<div class="px-3 py-2.5 text-xs text-slate-400">לא נמצאה מדינה תואמת</div>`;
        return;
      }

      menu.innerHTML = matches.map(c => `
        <button type="button" onclick="selectCountryFromDropdown('${escapeJsStr(c.name)}')" class="w-full px-3 py-2 text-right text-sm flex items-center justify-between gap-2 hover:bg-indigo-50 dark:hover:bg-slate-700/70 transition">
          <div class="flex items-center gap-2 min-w-0">
            <span class="emoji-flag text-lg shrink-0">${c.flag}</span>
            <span class="font-medium truncate">${c.name}</span>
          </div>
          ${c.former ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 dark:bg-amber-950/70 text-amber-800 dark:text-amber-300 shrink-0">עבר</span>` : ""}
        </button>
      `).join("");
    }

    function selectCountryFromDropdown(countryName) {
      const meta = getCountryMeta(countryName);
      setCountryInputVisualState(meta.name, meta.flag);
      closeCountryDropdown();
      onFormCountryChange();
    }

    function resetCurrencyFieldEmpty() {
      currentCurrencyOptions = [];
      document.getElementById("form-currency-select").value = "";
      document.getElementById("form-currency-display").textContent = "בחר מטבע...";
      const customInput = document.getElementById("form-currency-custom");
      customInput.classList.add("hidden");
      customInput.value = "";
    }

    function toggleCurrencyDropdown() {
      const menu = document.getElementById("currency-dropdown-menu");
      if (!menu.classList.contains("hidden")) {
        closeCurrencyDropdown();
        return;
      }
      closeCountryDropdown();
      renderCurrencyDropdownList();
      menu.classList.remove("hidden");
    }

    function closeCurrencyDropdown() {
      document.getElementById("currency-dropdown-menu").classList.add("hidden");
    }

    function renderCurrencyDropdownList() {
      const menu = document.getElementById("currency-dropdown-menu");
      const currentVal = document.getElementById("form-currency-select").value;
      const items = [
        ...currentCurrencyOptions.map(c => ({ value: c, label: c })),
        { value: "__custom__", label: "אחר (הקלדה ידנית)..." }
      ];

      menu.innerHTML = items.map(opt => {
        const active = opt.value === currentVal;
        return `
          <button type="button" onclick="selectCurrencyFromDropdown('${escapeJsStr(opt.value)}')" class="w-full px-3 py-2 text-right text-sm flex items-center justify-between hover:bg-indigo-50 dark:hover:bg-slate-700/70 transition ${active ? 'bg-indigo-50/70 dark:bg-indigo-950/40 font-semibold text-indigo-700 dark:text-indigo-300' : ''}">
            <span class="truncate">${opt.label}</span>
            ${active ? `<span class="text-xs">✓</span>` : ""}
          </button>
        `;
      }).join("");
    }

    function selectCurrencyFromDropdown(val) {
      document.getElementById("form-currency-select").value = val;
      const customInput = document.getElementById("form-currency-custom");
      if (val === "__custom__") {
        document.getElementById("form-currency-display").textContent = "אחר (הקלדה ידנית)...";
        customInput.classList.remove("hidden");
        closeCurrencyDropdown();
        customInput.focus();
      } else {
        document.getElementById("form-currency-display").textContent = val;
        customInput.classList.add("hidden");
        closeCurrencyDropdown();
      }
    }

    // Add / Edit / Duplicate / Confirm Modal Logic
    function handleModalBackdropClick(e) {
      if (e.target.id === "item-modal") {
        closeItemModal();
      }
    }

    function openItemModal(itemId = null, prefillCountry = null) {
      const modal = document.getElementById("item-modal");
      const form = document.getElementById("item-form");
      form.reset();
      closeCountryDropdown();
      closeCurrencyDropdown();
      closeAllFilterDropdowns();
      originalEditingItem = null;
      pendingEditAction = null;

      const btnSaveMain = document.getElementById("btn-save-main");
      const btnSaveAsNew = document.getElementById("btn-save-as-new");
      const btnDelete = document.getElementById("btn-delete-item");

      document.getElementById("edit-item-id").value = itemId || "";

      if (itemId) {
        const item = collection.find(i => i.id === itemId);
        if (!item) return;
        originalEditingItem = { ...item };

        document.getElementById("modal-title").textContent = "עריכת פריט";
        btnSaveMain.textContent = "שמור שינויים";
        btnSaveAsNew.classList.remove("hidden");
        btnDelete.classList.remove("hidden");

        selectFormType(item.type);

        const meta = getCountryMeta(item.country);
        setCountryInputVisualState(item.country, meta.flag);
        onFormCountryChange(item.currency);

        document.getElementById("form-value").value = formatDenomination(item.value);
        document.getElementById("form-year").value = hasValidYear(item.year) ? item.year : "";
        document.getElementById("form-quantity").value = item.quantity || 1;
      } else {
        document.getElementById("modal-title").textContent = "הוספת פריט חדש";
        btnSaveMain.textContent = "שמור פריט";
        btnSaveAsNew.classList.add("hidden");
        btnDelete.classList.add("hidden");

        selectFormType("coin");
        if (prefillCountry) {
          const meta = getCountryMeta(prefillCountry);
          setCountryInputVisualState(prefillCountry, meta.flag);
          onFormCountryChange();
        } else {
          setCountryInputVisualState("", "");
          resetCurrencyFieldEmpty();
        }
        document.getElementById("form-quantity").value = 1;
      }

      modal.classList.remove("hidden");
    }

    function closeItemModal() {
      closeCountryDropdown();
      closeCurrencyDropdown();
      originalEditingItem = null;
      pendingEditAction = null;
      document.getElementById("item-modal").classList.add("hidden");
    }

    function scrollFieldIntoView(el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 250);
    }

    function selectFormType(type) {
      document.getElementById("form-type").value = type;
      const btnCoin = document.getElementById("btn-type-coin");
      const btnNote = document.getElementById("btn-type-banknote");
      if (type === "coin") {
        btnCoin.className = "py-2 rounded-lg text-xs font-semibold bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-xs transition";
        btnNote.className = "py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 transition";
      } else {
        btnNote.className = "py-2 rounded-lg text-xs font-semibold bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-xs transition";
        btnCoin.className = "py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 transition";
      }
    }

    function onFormCountryChange(selectedCurrency = null) {
      const countryName = document.getElementById("form-country").value;
      const meta = getCountryMeta(countryName);
      const currSel = document.getElementById("form-currency-select");
      const currDisplay = document.getElementById("form-currency-display");
      const customInput = document.getElementById("form-currency-custom");

      currentCurrencyOptions = meta.currencies.length ? meta.currencies : ["מטבע מקומי"];

      if (selectedCurrency) {
        if (currentCurrencyOptions.includes(selectedCurrency)) {
          currSel.value = selectedCurrency;
          currDisplay.textContent = selectedCurrency;
          customInput.classList.add("hidden");
          customInput.value = "";
        } else {
          currSel.value = "__custom__";
          currDisplay.textContent = "אחר (הקלדה ידנית)...";
          customInput.value = selectedCurrency;
          customInput.classList.remove("hidden");
        }
      } else {
        const defaultCurr = currentCurrencyOptions[0];
        currSel.value = defaultCurr;
        currDisplay.textContent = defaultCurr;
        customInput.classList.add("hidden");
        customInput.value = "";
      }
    }

    function collectFormData() {
      const editId = document.getElementById("edit-item-id").value;
      const type = document.getElementById("form-type").value;

      let country = document.getElementById("form-country").value.trim();
      const typedCountry = document.getElementById("form-country-input").value.trim();
      if (typedCountry && typedCountry !== country) {
        const exactMatch = COUNTRIES_DB.find(c => c.name === typedCountry);
        country = exactMatch ? exactMatch.name : typedCountry;
      }
      if (!country) {
        showToast("נא לבחור או להזין מדינה");
        return null;
      }

      const currSel = document.getElementById("form-currency-select").value;
      const currency = currSel === "__custom__"
        ? document.getElementById("form-currency-custom").value.trim()
        : (currSel || (currentCurrencyOptions[0] || ""));

      if (!currency) {
        showToast("נא לבחור או להזין שם מטבע");
        return null;
      }

      const value = parseDenomination(document.getElementById("form-value").value);
      const yearRaw = document.getElementById("form-year").value.trim();
      const year = yearRaw === "" ? null : parseInt(yearRaw, 10);
      const quantity = parseInt(document.getElementById("form-quantity").value, 10) || 1;

      if (isNaN(value) || value < 0) {
        showToast("נא למלא ערך נקוב תקין");
        return null;
      }
      if (yearRaw !== "" && isNaN(year)) {
        showToast("נא להזין שנת הנפקה תקינה או להשאיר ריק");
        return null;
      }

      return { editId, type, country, currency, value, year, quantity };
    }

    function hasItemChanged(orig, nextData) {
      if (!orig || !nextData) return true;
      return (
        orig.type !== nextData.type ||
        orig.country !== nextData.country ||
        orig.currency !== nextData.currency ||
        Number(orig.value) !== Number(nextData.value) ||
        normalizeYear(orig.year) !== normalizeYear(nextData.year) ||
        Number(orig.quantity || 1) !== Number(nextData.quantity || 1)
      );
    }

    function handleSaveAsNewClick() {
      const form = document.getElementById("item-form");
      if (!form.reportValidity()) return;
      const data = collectFormData();
      if (!data) return;

      if (originalEditingItem) {
        const changed = hasItemChanged(originalEditingItem, data);
        openEditConfirmModal({
          action: "create_new",
          data,
          title: "שמירה כפריט חדש",
          message: changed
            ? `לשמור את ${formatDenomination(data.value)} ${data.currency} (${data.country}, ${formatYearText(data.year)}) כפריט חדש באוסף ולהשאיר את הפריט המקורי ללא שינוי?`
            : `לא בוצעו שינויים מול הפריט המקורי. ליצור עותק זהה כפריט חדש באוסף?`,
          btnText: "שמור כפריט חדש"
        });
      } else {
        commitSaveItem(data, "create_new");
      }
    }

    function handleSaveItem(e, mode = "update") {
      if (e) e.preventDefault();
      const data = collectFormData();
      if (!data) return;

      if (data.editId && mode === "update") {
        if (!hasItemChanged(originalEditingItem, data)) {
          closeItemModal();
          showToast("לא בוצעו שינויים");
          return;
        }
        openEditConfirmModal({
          action: "update",
          data,
          title: "אישור עדכון פריט",
          message: `לעדכן את הפריט הקיים ל-${formatDenomination(data.value)} ${data.currency} (${data.country}, ${formatYearText(data.year)}, כמות: ${data.quantity})?`,
          btnText: "אשר ועדכן"
        });
        return;
      }

      commitSaveItem(data, mode);
    }

    function openEditConfirmModal({ action, data, title, message, btnText }) {
      pendingEditAction = { action, data };
      document.getElementById("edit-confirm-title").textContent = title;
      document.getElementById("edit-confirm-message").textContent = message;
      document.getElementById("edit-confirm-btn").textContent = btnText;
      document.getElementById("edit-confirm-modal").classList.remove("hidden");
    }

    function closeEditConfirmModal() {
      pendingEditAction = null;
      document.getElementById("edit-confirm-modal").classList.add("hidden");
    }

    function executeConfirmedEditAction() {
      if (!pendingEditAction) return;
      const { action, data } = pendingEditAction;
      closeEditConfirmModal();
      commitSaveItem(data, action);
    }

    function commitSaveItem(data, mode) {
      const { editId, type, country, currency, value, year, quantity } = data;
      const normalizedYear = normalizeYear(year);

      if (editId && mode === "update") {
        const idx = collection.findIndex(i => i.id === editId);
        if (idx !== -1) {
          collection[idx] = { id: editId, type, country, currency, value, year: normalizedYear, quantity };
        }
        finalizeSave("השינויים נשמרו בהצלחה", country);
        return;
      }

      const existing = collection.find(i =>
        i.type === type &&
        i.country === country &&
        i.currency === currency &&
        Number(i.value) === value &&
        normalizeYear(i.year) === normalizedYear
      );

      if (existing) {
        pendingDuplicate = { existingId: existing.id, addQty: quantity };
        const typeLabel = type === "coin" ? "מטבע" : "שטר";
        document.getElementById("duplicate-message").textContent =
          `${typeLabel} של ${formatDenomination(value)} ${currency} (${country}, ${formatYearText(normalizedYear)}) כבר נמצא באוסף שלך (כמות נוכית: ${existing.quantity || 1}). האם להוסיף אליו עוד ${quantity}?`;
        document.getElementById("duplicate-modal").classList.remove("hidden");
        return;
      }

      collection.push({
        id: String(Date.now()),
        type,
        country,
        currency,
        value,
        year: normalizedYear,
        quantity
      });
      finalizeSave(mode === "create_new" ? "נשמר כפריט חדש באוסף" : "הפריט נוסף לאוסף", country);
    }

    function confirmMergeDuplicate() {
      if (!pendingDuplicate) return;
      const target = collection.find(i => i.id === pendingDuplicate.existingId);
      let targetCountry = null;
      if (target) {
        target.quantity = (Number(target.quantity) || 1) + pendingDuplicate.addQty;
        targetCountry = target.country;
      }
      pendingDuplicate = null;
      document.getElementById("duplicate-modal").classList.add("hidden");
      finalizeSave("הכמות עודכנה בפריט הקיים", targetCountry);
    }

    function closeDuplicateModal() {
      pendingDuplicate = null;
      document.getElementById("duplicate-modal").classList.add("hidden");
    }

    function openDeleteConfirmModal() {
      const editId = document.getElementById("edit-item-id").value;
      if (!editId) return;
      const item = collection.find(i => i.id === editId);
      const label = item
        ? `${formatDenomination(item.value)} ${item.currency} • ${item.country} (${formatYearText(item.year)})`
        : "הפריט הנבחר";
      document.getElementById("delete-confirm-message").textContent =
        `האם אתה בטוח שברצונך למחוק לצמיתות את ${label}?`;
      document.getElementById("delete-confirm-modal").classList.remove("hidden");
    }

    function closeDeleteConfirmModal() {
      document.getElementById("delete-confirm-modal").classList.add("hidden");
    }

    function confirmDeleteItem() {
      const editId = document.getElementById("edit-item-id").value;
      closeDeleteConfirmModal();
      if (!editId) return;
      collection = collection.filter(i => i.id !== editId);
      finalizeSave("הפריט נמחק מהאוסף", null);
    }

    function finalizeSave(toastMsg, targetCountry = null) {
      saveCollection();
      updateFilterDropdowns();

      if (targetCountry) {
        const meta = getCountryMeta(targetCountry);
        if (meta && meta.continent) {
          collapsedContinents[meta.continent] = false;
        }
        collapsedCountries[targetCountry] = false;
        isAllCollapsed = false;
      }

      renderCollection();
      if (!document.getElementById("view-oldest-coins").classList.contains("hidden")) {
        openOldestCoinsView();
      } else if (!document.getElementById("view-stats").classList.contains("hidden")) {
        renderStats();
      }
      closeItemModal();
      showToast(toastMsg);

      if (targetCountry) {
        scrollToCountryBlock(targetCountry);
      }
    }

    // Export / Share / Import Logic
    function openDataModal() {
      document.getElementById("export-choice-panel").classList.add("hidden");
      pendingExportFormat = null;
      document.getElementById("data-modal").classList.remove("hidden");
    }

    function closeDataModal() {
      document.getElementById("data-modal").classList.add("hidden");
    }

    function promptExportFormat(fmt) {
      pendingExportFormat = fmt;
      const names = { xlsx: "Excel (.xlsx)", csv: "CSV (.csv)", json: "JSON (.json)" };
      document.getElementById("export-choice-title").textContent = `ייצוא קובץ ${names[fmt]} — בחר פעולה:`;
      document.getElementById("export-choice-panel").classList.remove("hidden");
    }

    function buildExportFile(fmt) {
      const dateStr = new Date().toISOString().slice(0, 10);
      if (fmt === "json") {
        const blob = new Blob([JSON.stringify(collection, null, 2)], { type: "application/json" });
        return { blob, filename: `coin-collection-${dateStr}.json` };
      }

      const rows = collection.map(i => ({
        "סוג": i.type === "coin" ? "מטבע" : "שטר",
        "מדינה": i.country,
        "שם מטבע": i.currency,
        "ערך": i.value,
        "שנה": hasValidYear(i.year) ? Number(i.year) : "",
        "כמות": i.quantity || 1
      }));

      if (fmt === "csv") {
        const headers = ["סוג", "מדינה", "שם מטבע", "ערך", "שנה", "כמות"];
        const csvLines = [
          headers.join(","),
          ...rows.map(r => headers.map(h => `"${String(r[h]).replace(/"/g, '""')}"`).join(","))
        ];
        const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
        return { blob, filename: `coin-collection-${dateStr}.csv` };
      }

      if (fmt === "xlsx") {
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "אוסף");
        const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        return { blob, filename: `coin-collection-${dateStr}.xlsx` };
      }
    }

    async function executeExport(mode) {
      if (!pendingExportFormat) return;
      const { blob, filename } = buildExportFile(pendingExportFormat);

      if (mode === "share") {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: "אוסף מטבעות ושטרות",
              text: "גיבוי אוסף מטבעות ושטרות"
            });
            closeDataModal();
            return;
          } catch (err) {
            if (err.name === "AbortError") return;
          }
        }
        showToast("הדפדפן לא תומך בשיתוף קובץ זה — מוריד למכשיר");
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      closeDataModal();
      showToast("הקובץ הורד למכשיר");
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const ext = file.name.split(".").pop().toLowerCase();

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          let imported = [];
          if (ext === "json") {
            const parsed = JSON.parse(e.target.result);
            if (Array.isArray(parsed)) {
              imported = parsed.map(item => ({
                ...item,
                year: normalizeYear(item.year)
              }));
            }
          } else {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws);
            imported = rows.map((r, idx) => {
              const rawY = r["שנה"] ?? r.year;
              const parsedY = (rawY === "" || rawY === null || rawY === undefined) ? null : parseInt(rawY, 10);
              return {
                id: String(Date.now() + idx),
                type: (r["סוג"] === "שטר" || r.type === "banknote") ? "banknote" : "coin",
                country: String(r["מדינה"] || r.country || "").trim(),
                currency: String(r["שם מטבע"] || r.currency || "").trim(),
                value: parseDenomination(r["ערך"] ?? r.value ?? 0) || 0,
                year: isNaN(parsedY) ? null : parsedY,
                quantity: parseInt(r["כמות"] ?? r.quantity ?? 1, 10) || 1
              };
            }).filter(x => x.country && x.currency);
          }

          if (!imported.length) {
            showToast("לא נמצאו נתונים תקינים בקובץ");
            return;
          }

          collection = imported;
          saveCollection();
          updateFilterDropdowns();
          renderCollection();
          closeDataModal();
          showToast(`יובאו ${imported.length} רשומות בהצלחה`);
        } catch (err) {
          showToast("שגיאה בקריאת הקובץ");
        }
      };

      if (ext === "json") {
        reader.readAsText(file);
      } else {
        reader.readAsArrayBuffer(file);
      }
      event.target.value = "";
    }

    init();
  </script>
</body>
