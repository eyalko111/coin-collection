<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="אוסף מטבעות" />
  <title>אוסף מטבעות ושטרות</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Heebo', 'Assistant', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Heebo', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .emoji-flag {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      line-height: 1;
    }
    .era-divider {
      border-top: 2px dashed rgba(99, 102, 241, 0.35) !important;
      margin-top: 2px;
    }
    .dark .era-divider {
      border-top-color: rgba(129, 140, 248, 0.32) !important;
    }
    .type-divider {
      border-top: 2px solid rgba(16, 185, 129, 0.38) !important;
      margin-top: 3px;
    }
    .dark .type-divider {
      border-top-color: rgba(52, 211, 153, 0.32) !important;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pb-24 transition-colors duration-200">

  <!-- Sticky Top Header -->
  <header id="app-header" class="sticky top-0 z-30 bg-white/95 dark:bg-slate-950/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80">
    <div class="max-w-2xl mx-auto px-4 pt-3">
      <div class="flex items-center justify-between gap-2 pb-2.5">
        <div class="min-w-0">
          <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white truncate">אוסף מטבעות ושטרות</h1>
          <p id="header-subtitle" class="text-xs text-slate-500 dark:text-slate-400 font-medium">טוען נתונים...</p>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Unified Data Management (Gear) -->
          <button type="button" onclick="openDataMenuModal()" title="ניהול נתונים, ייבוא וייצוא" aria-label="ניהול נתונים, ייבוא וייצוא" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-slate-800 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
          <input type="file" id="import-file-input" accept=".json,.csv,application/json,text/csv" onchange="handleImportFile(event)" class="hidden" />

          <!-- Dark Mode Toggle -->
          <button type="button" onclick="toggleDarkMode()" title="מצב כהה / בהיר" aria-label="מצב כהה או בהיר" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-600 dark:hover:bg-slate-800 transition">
            <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex border-t border-slate-100 dark:border-slate-900">
        <button type="button" id="tab-collection" onclick="switchTab('collection')" class="flex-1 py-2.5 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 transition">
          האוסף שלי
        </button>
        <button type="button" id="tab-stats" onclick="switchTab('stats')" class="flex-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 dark:text-slate-400 transition">
          סטטיסטיקות
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 pt-4">

    <!-- VIEW 1: COLLECTION -->
    <section id="view-collection" class="space-y-3.5">
      <!-- Search Bar -->
      <div class="relative">
        <svg class="w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
        <input type="text" id="search-input" oninput="renderCollection()" placeholder="חיפוש מדינה, מטבע, ערך, שנה או מיקום..." class="w-full pr-10 pl-9 py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-900 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 border border-transparent focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-950 outline-none transition" />
        <button type="button" id="clear-search-btn" onclick="clearSearch()" title="נקה חיפוש" class="hidden absolute left-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs flex items-center justify-center hover:bg-slate-300 transition">✕</button>
      </div>

      <!-- Type Filter Pills -->
      <div class="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-slate-100 dark:bg-slate-900">
        <button type="button" data-type="all" onclick="setTypeFilter('all')" class="type-pill py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-xs transition">הכול</button>
        <button type="button" data-type="coin" onclick="setTypeFilter('coin')" class="type-pill py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 transition">מטבעות</button>
        <button type="button" data-type="banknote" onclick="setTypeFilter('banknote')" class="type-pill py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 transition">שטרות</button>
      </div>

      <!-- Dropdown Filters: Continent / Country / Decade -->
      <div class="grid grid-cols-3 gap-2">
        <!-- Continent Filter -->
        <div class="relative" data-filter-wrap>
          <button type="button" id="filter-continent-trigger" onclick="toggleFilterDropdown('continent')" class="w-full px-2.5 py-2 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-transparent focus:border-indigo-500 outline-none flex items-center justify-between gap-1 text-right transition">
            <span id="filter-continent-display" class="truncate">כל היבשות</span>
            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="filter-continent-menu" class="hidden absolute right-0 mt-1.5 w-44 max-h-64 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-30"></div>
        </div>

        <!-- Country Filter -->
        <div class="relative" data-filter-wrap>
          <button type="button" id="filter-country-trigger" onclick="toggleFilterDropdown('country')" class="w-full px-2.5 py-2 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-transparent focus:border-indigo-500 outline-none flex items-center justify-between gap-1 text-right transition">
            <span id="filter-country-display" class="truncate">כל המדינות</span>
            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="filter-country-menu" class="hidden absolute right-0 mt-1.5 w-52 max-h-64 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-30"></div>
        </div>

        <!-- Decade Filter -->
        <div class="relative" data-filter-wrap>
          <button type="button" id="filter-decade-trigger" onclick="toggleFilterDropdown('decade')" class="w-full px-2.5 py-2 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-transparent focus:border-indigo-500 outline-none flex items-center justify-between gap-1 text-right transition">
            <span id="filter-decade-display" class="truncate">כל העשורים</span>
            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="filter-decade-menu" class="hidden absolute left-0 mt-1.5 w-44 max-h-64 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-30"></div>
        </div>
      </div>

      <!-- Group Mode & Collapse/Expand Controls -->
      <div class="flex items-center justify-between gap-2 pt-0.5">
        <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-900">
          <button type="button" data-group="alpha" onclick="setGroupMode('alpha')" class="group-pill px-2.5 py-1 rounded-lg text-xs font-semibold bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-xs transition">לפי א-ב</button>
          <button type="button" data-group="continent" onclick="setGroupMode('continent')" class="group-pill px-2.5 py-1 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 transition">לפי יבשות</button>
        </div>

        <div id="collapse-controls-bar">
          <button type="button" onclick="toggleCollapseAll()" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-800 transition">
            <svg id="icon-toggle-collapse" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 15l-6-6-6 6"/></svg>
            <span id="label-toggle-collapse">כווץ הכול</span>
          </button>
        </div>
      </div>

      <!-- Collection List Container -->
      <div id="collection-container" class="pt-1"></div>
    </section>

    <!-- VIEW 2: STATISTICS -->
    <section id="view-stats" class="hidden">
      <div id="stats-container" class="space-y-4"></div>
    </section>

    <!-- VIEW 3: TOP 15 OLDEST COINS -->
    <section id="view-oldest-coins" class="hidden space-y-3">
      <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-200 dark:border-slate-800">
        <div>
          <h2 class="text-base font-bold text-slate-900 dark:text-white">15 המטבעות הישנים באוסף</h2>
          <p id="oldest-coins-subtitle" class="text-xs text-slate-500 dark:text-slate-400"></p>
        </div>
        <button type="button" onclick="closeOldestCoinsView()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
          חזרה לסטטיסטיקות →
        </button>
      </div>
      <div id="oldest-coins-list" class="divide-y divide-slate-100 dark:divide-slate-900"></div>
    </section>

  </main>

  <!-- Floating Action Button (+) -->
  <button type="button" onclick="openItemModal()" title="הוסף מטבע או שטר" aria-label="הוסף מטבע או שטר" class="fixed bottom-6 left-6 z-30 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center text-2xl font-bold transition">
    +
  </button>

  <!-- MODAL 1: ITEM DETAILS (CENTERED READ-ONLY INFO POPUP) -->
  <div id="item-details-modal" onclick="if(event.target===this) closeItemDetailsModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-md max-h-[85vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-3.5">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <span id="details-flag" class="emoji-flag text-3xl shrink-0"></span>
          <div class="min-w-0">
            <h3 id="details-country" class="text-sm font-bold text-slate-900 dark:text-white leading-snug truncate"></h3>
            <span id="details-type-badge" class="inline-block mt-0.5 px-2 py-0.5 rounded-md text-[11px] font-semibold"></span>
          </div>
        </div>
        <button type="button" onclick="closeItemDetailsModal()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs shrink-0">✕</button>
      </div>

      <div class="space-y-1.5">
        <div class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-500 dark:text-slate-400">ערך ומטבע</span>
          <span id="details-value-currency" class="font-bold text-slate-900 dark:text-white"></span>
        </div>
        <div class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-500 dark:text-slate-400">שנת הנפקה</span>
          <span id="details-year" class="font-semibold text-slate-800 dark:text-slate-100"></span>
        </div>
        <div class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-500 dark:text-slate-400">כמות באוסף</span>
          <span id="details-quantity" class="font-semibold text-slate-800 dark:text-slate-100"></span>
        </div>
        <div class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-500 dark:text-slate-400 shrink-0">מיקום אחסון</span>
          <span id="details-location" class="truncate text-left"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL 2: ADD / EDIT ITEM (FLUSH TOP-ALIGNED SO MOBILE KEYBOARD NEVER COVERS IT) -->
  <div id="item-modal" onclick="if(event.target===this) closeItemModal()" class="hidden fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-xs flex items-start justify-center pt-0 px-0 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-md max-h-[94vh] sm:max-h-[88vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-b-3xl sm:rounded-3xl p-5 shadow-2xl border-b border-x sm:border border-slate-200/80 dark:border-slate-800">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
        <h3 id="item-modal-title" class="text-base font-bold text-slate-900 dark:text-white">הוספת פריט חדש</h3>
        <button type="button" onclick="closeItemModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-sm">✕</button>
      </div>

      <form onsubmit="handleItemFormSubmit(event)" class="space-y-3.5">
        <input type="hidden" id="form-item-id" />
        <input type="hidden" id="form-type" value="coin" />

        <!-- Item Type Toggle -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">סוג פריט</label>
          <div class="flex gap-1.5 p-1 rounded-2xl bg-slate-100 dark:bg-slate-950">
            <button type="button" data-form-type="coin" onclick="setFormType('coin')" class="form-type-pill flex-1 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-xs transition">מטבע</button>
            <button type="button" data-form-type="banknote" onclick="setFormType('banknote')" class="form-type-pill flex-1 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 transition">שטר</button>
          </div>
        </div>

        <!-- Country Searchable Selector -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="form-country-input" class="text-xs font-semibold text-slate-600 dark:text-slate-300">מדינה</label>
            <button type="button" id="btn-form-series-info" onclick="openCurrentFormCountrySeriesInfo()" class="hidden inline-flex items-center gap-1 text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
              <span>ⓘ סדרות ותקופות במדינה זו</span>
            </button>
          </div>
          <div class="relative">
            <input type="hidden" id="form-country" />
            <input type="text" id="form-country-input" autocomplete="off" onfocus="onCountryInputFocus()" oninput="onCountryInputChange()" placeholder="הקלד או בחר מדינה..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-transparent focus:border-indigo-500 outline-none transition" />
            <div id="form-country-dropdown" class="hidden absolute right-0 left-0 mt-1.5 max-h-56 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-40"></div>
          </div>
        </div>

        <!-- Currency Selector -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">מטבע</label>
          <div class="relative">
            <input type="hidden" id="form-currency" />
            <button type="button" id="form-currency-trigger" onclick="toggleCurrencyDropdown()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-transparent focus:border-indigo-500 outline-none flex items-center justify-between text-right transition">
              <span id="form-currency-display" class="truncate">בחר מטבע...</span>
              <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="form-currency-dropdown" class="hidden absolute right-0 left-0 mt-1.5 max-h-52 overflow-y-auto rounded-2xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-40"></div>
          </div>
          <div id="form-currency-custom-wrap" class="hidden mt-2">
            <input type="text" id="form-currency-custom-input" oninput="onCustomCurrencyInputChange()" placeholder="הזן שם מטבע (למשל: פרנק שווייצרי)" class="w-full px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-indigo-300 dark:border-indigo-800 outline-none" />
          </div>
        </div>

        <!-- Denomination & Year -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label for="form-value" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">ערך נקוב</label>
            <input type="text" id="form-value" inputmode="decimal" onfocus="onValueFieldFocus(this)" onblur="onValueFieldBlur(this)" placeholder="למשל: 5 או 0.5" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-transparent focus:border-indigo-500 outline-none transition" />
          </div>
          <div>
            <label for="form-year" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">שנת הנפקה (רשות)</label>
            <input type="number" id="form-year" inputmode="numeric" placeholder="ללא שנה" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-transparent focus:border-indigo-500 outline-none transition" />
          </div>
        </div>

        <!-- Quantity & Storage Location -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label for="form-quantity" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">כמות</label>
            <div class="flex items-center rounded-xl bg-slate-100 dark:bg-slate-950 p-1">
              <button type="button" onclick="adjustFormQuantity(-1)" class="w-8 h-8 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-base flex items-center justify-center shadow-2xs">−</button>
              <input type="number" id="form-quantity" min="1" value="1" class="w-full text-center bg-transparent text-sm font-bold text-slate-900 dark:text-white outline-none" />
              <button type="button" onclick="adjustFormQuantity(1)" class="w-8 h-8 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-base flex items-center justify-center shadow-2xs">+</button>
            </div>
          </div>

          <div>
            <label for="form-location" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">מיקום אחסון (רשות)</label>
            <input type="text" id="form-location" list="location-suggestions" placeholder="למשל: אלבום 1" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 text-sm text-slate-900 dark:text-slate-100 border border-transparent focus:border-indigo-500 outline-none transition" />
            <datalist id="location-suggestions"></datalist>
          </div>
        </div>

        <!-- Add Mode Submit Button -->
        <div id="form-add-actions" class="pt-2">
          <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition">
            שמור פריט
          </button>
        </div>

        <!-- Edit Mode 3-Button Row: Save / Save as New / Delete -->
        <div id="form-edit-actions" class="hidden grid grid-cols-3 gap-2 pt-2">
          <button type="button" onclick="onEditSaveClick()" class="py-2.5 px-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition">
            שמור
          </button>
          <button type="button" onclick="onEditSaveAsNewClick()" class="py-2.5 px-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm transition">
            שמור כחדש
          </button>
          <button type="button" onclick="onEditDeleteClick()" class="py-2.5 px-2 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-950 text-xs font-semibold transition">
            מחק
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: SERIES & ERAS INFO -->
  <div id="series-info-modal" onclick="if(event.target===this) closeSeriesInfoModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-md max-h-[85vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-3.5">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <span id="series-info-flag" class="emoji-flag text-3xl shrink-0"></span>
          <div class="min-w-0">
            <h3 id="series-info-title" class="text-sm font-bold text-slate-900 dark:text-white leading-snug"></h3>
            <p id="series-info-subtitle" class="text-[11px] text-indigo-600 dark:text-indigo-400 font-medium"></p>
          </div>
        </div>
        <button type="button" onclick="closeSeriesInfoModal()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs shrink-0">✕</button>
      </div>
      <p id="series-info-desc" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      <div id="series-info-list" class="space-y-1.5"></div>
      <p id="series-info-note" class="text-[11px] text-slate-400 dark:text-slate-500 leading-relaxed"></p>
    </div>
  </div>

  <!-- MODAL 4: DUPLICATE CONFIRMATION -->
  <div id="duplicate-modal" onclick="if(event.target===this) closeDuplicateModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <h3 class="text-base font-bold text-slate-900 dark:text-white">פריט זהה כבר קיים באוסף</h3>
      <p id="duplicate-modal-desc" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      <div class="space-y-2">
        <button type="button" onclick="confirmDuplicateMerge()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">
          אחד כמויות לפריט הקיים (מומלץ)
        </button>
        <button type="button" onclick="confirmDuplicateSeparate()" class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold transition">
          שמור כרשומה נפרדת
        </button>
        <button type="button" onclick="closeDuplicateModal()" class="w-full py-2 text-xs text-slate-400 hover:text-slate-600 transition">
          ביטול
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 5: UNIFIED EDIT ACTION CONFIRMATION (SAVE / SAVE AS NEW / DELETE) -->
  <div id="edit-confirm-modal" onclick="if(event.target===this) closeEditConfirmModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <h3 id="edit-confirm-title" class="text-base font-bold text-slate-900 dark:text-white">אישור פעולה</h3>
      <p id="edit-confirm-desc" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      <div class="flex items-center gap-2">
        <button type="button" id="edit-confirm-btn" onclick="confirmPendingEditAction()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">
          אישור
        </button>
        <button type="button" onclick="closeEditConfirmModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold transition">
          ביטול
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 6: UNIFIED DATA MANAGEMENT (EXPORT / IMPORT / COLLECTION DATA) -->
  <div id="data-menu-modal" onclick="if(event.target===this) closeDataMenuModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm max-h-[88vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900 dark:text-white">ניהול נתונים</h3>
        <button type="button" onclick="closeDataMenuModal()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs">✕</button>
      </div>

      <!-- Export Section -->
      <div class="space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200">ייצוא וגיבוי</div>
        <button type="button" onclick="executeExport('json')" class="w-full p-3 rounded-2xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 text-right hover:bg-indigo-100/70 transition">
          <div class="text-xs font-bold text-indigo-700 dark:text-indigo-300">קובץ גיבוי מלא (JSON)</div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">מומלץ לשחזור או העברה למכשיר אחר</div>
        </button>
        <button type="button" onclick="executeExport('excel')" class="w-full p-3 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/60 text-right hover:bg-emerald-100/70 transition">
          <div class="text-xs font-bold text-emerald-700 dark:text-emerald-300">גיליון Excel (.xls)</div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">טבלה מעוצבת בעברית לפתיחה באקסל</div>
        </button>
        <button type="button" onclick="executeExport('csv')" class="w-full p-3 rounded-2xl bg-slate-100/80 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700 text-right hover:bg-slate-200/70 transition">
          <div class="text-xs font-bold text-slate-800 dark:text-slate-200">קובץ CSV</div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">תואם לגיליונות אלקטרוניים וייבוא חוזר</div>
        </button>
      </div>

      <!-- Import Section -->
      <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200">ייבוא מקובץ</div>
        <button type="button" onclick="triggerImportFile()" class="w-full p-3 rounded-2xl bg-slate-100/90 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 text-right hover:bg-slate-200/70 dark:hover:bg-slate-800 transition">
          <div class="text-xs font-bold text-slate-900 dark:text-white">בחר קובץ לייבוא (JSON / CSV)</div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">מיזוג עם האוסף הקיים או החלפה מלאה</div>
        </button>
      </div>

      <!-- Collection Data Actions (Double Safe Entry) -->
      <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div class="text-xs font-bold text-slate-700 dark:text-slate-200">נתוני האוסף</div>
        <button type="button" onclick="requestSampleRestoreStep1()" class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold transition">
          טען נתוני דוגמה מחדש
        </button>
        <button type="button" onclick="requestResetCollectionStep1()" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold transition">
          רוקן את האוסף לחלוטין
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 7: IMPORT CONFIRMATION -->
  <div id="import-modal" onclick="if(event.target===this) closeImportConfirmModal()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <h3 class="text-base font-bold text-slate-900 dark:text-white">ייבוא פריטים מקובץ</h3>
      <p id="import-modal-desc" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      <div class="space-y-2">
        <button type="button" onclick="confirmImportMerge()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">
          מזג עם האוסף הקיים (אחד כפילויות)
        </button>
        <button type="button" onclick="confirmImportReplace()" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold transition">
          החלף את כל האוסף בקובץ המיובא
        </button>
        <button type="button" onclick="closeImportConfirmModal()" class="w-full py-2 text-xs text-slate-400 hover:text-slate-600 transition">
          ביטול
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 8: DOUBLE-SAFE COLLECTION ACTION CONFIRMATION (STEP 1 & STEP 2) -->
  <div id="reset-modal" onclick="if(event.target===this) cancelDoubleSafeAction()" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <div class="flex items-center justify-between gap-2">
        <div>
          <span id="double-safe-step-badge" class="inline-block px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-100 dark:bg-amber-950/70 text-amber-800 dark:text-amber-300 mb-1">שלב 1 מתוך 2</span>
          <h3 id="double-safe-title" class="text-base font-bold text-slate-900 dark:text-white">אישור פעולה</h3>
        </div>
        <button type="button" onclick="cancelDoubleSafeAction()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs shrink-0">✕</button>
      </div>
      <p id="double-safe-desc" class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></p>
      <div class="flex items-center gap-2">
        <button type="button" id="double-safe-confirm-btn" onclick="advanceDoubleSafeAction()" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold transition">
          המשך לשלב 2
        </button>
        <button type="button" onclick="cancelDoubleSafeAction()" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold transition">
          ביטול
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-semibold shadow-xl whitespace-nowrap"></div>

  <!-- Modular Application Scripts -->
  <script src="./countries-data.js"></script>
  <script src="./series-data.js"></script>
  <script src="./collection.js"></script>
  <script src="./stats.js"></script>
  <script src="./modals.js"></script>
  <script src="./io.js"></script>
  <script src="./app.js"></script>
</body>
</html>
